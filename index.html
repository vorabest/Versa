<style>
:root{--bg:#000;--fg:#fff;--card:rgba(255,255,255,.08);--mut:rgba(255,255,255,.62);--ac:#fff;--bd:rgba(255,255,255,.16);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:0;--ff:"Prompt","Noto Sans Thai",system-ui,-apple-system,sans-serif}

*{box-sizing:border-box}

.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.row{display:flex;gap:8px;align-items:center;margin:6px 0}.row>*{flex:0 1 auto}.row>input,.row>select{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}

.x{background:none;border:0;color:var(--mut);cursor:pointer;font-size:18px}
.cover{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
#rest{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--bd);display:none}
#rest .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px}
#rest b{font-size:26px;font-variant-numeric:tabular-nums;flex:1}
.dots{display:flex;gap:4px}.dots i{width:14px;height:14px;border-radius:4px;background:var(--card);border:1px solid var(--bd)}.dots i.on{background:var(--ac);border-color:var(--ac)}.dots i.sk{background:none;border-style:dashed}
input[type=range]{padding:0}input[type=checkbox]{width:22px;height:22px;flex:none}
.mz{fill:var(--c,var(--ac));fill-opacity:.55;stroke:var(--bg);stroke-width:1.2;cursor:pointer;transition:fill-opacity .15s}.mz.on{fill-opacity:1;stroke:var(--fg);stroke-width:2}.mz:active{fill-opacity:.8}.ln{fill:none;stroke:var(--bg);stroke-opacity:.55;stroke-width:1.2;pointer-events:none}.nz{fill:var(--card);stroke:var(--bd);stroke-width:1}.top svg{flex:none;color:var(--ac)}.tile svg{color:var(--ac)}textarea{min-height:90px;width:100%}
.nav5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:18px 0}.nav5 button{aspect-ratio:1/1.2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:16px;color:var(--fg);font-size:12px;font-weight:600;padding:6px 2px;cursor:pointer}.nav5 svg{color:var(--ac)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 8px;text-align:center;cursor:pointer}.stat b{display:block;font-size:32px;font-weight:700;line-height:1.1}.stat span{font-size:12px;color:var(--mut)}
.sets{border-top:1px solid var(--bd);margin-top:8px;padding-top:6px}.act{background:var(--card);border-radius:10px;padding:8px;margin:6px 0}
.seg{display:grid;gap:4px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:4px;margin:10px 0}.s5{grid-template-columns:repeat(5,1fr)}.s7{grid-template-columns:repeat(7,1fr)}.seg button{border:0;background:none;color:var(--fg);border-radius:10px;padding:10px 0;font-size:13px;cursor:pointer;min-width:0}.seg button.on{background:var(--ac);color:var(--onac,var(--bg));font-weight:600}.seg sup{font-size:9px;margin-left:1px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;margin-top:8px}.cal small{color:var(--mut);font-size:12px}.cal i{display:block}.cd{aspect-ratio:1;border-radius:10px;border:1px solid transparent;background:none;color:var(--fg);font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;padding:0;gap:2px}.cd.tdy{border-color:var(--ac)}.cd.sel{background:var(--ac);color:var(--onac,var(--bg))}.cd span{display:flex;gap:2px;height:5px}.cd u{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.85}.cd u.w{border-radius:1px}
.mg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.mg button{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 4px;color:var(--fg);font-size:15px;font-weight:600;cursor:pointer}.mg button small{display:block;font-weight:400;color:var(--mut);font-size:11px}.mg button.on{background:var(--ac);color:var(--onac,var(--bg))}.mg button.on small{color:inherit}
.s2{grid-template-columns:repeat(2,1fr)}
.hero{position:fixed;inset:0;z-index:5;background:linear-gradient(165deg,#7f9d8e 0%,#6a8aa0 100%);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(40px + env(safe-area-inset-top,0px)) 24px calc(32px + env(safe-area-inset-bottom,0px));text-align:center}
.hmid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}.hero h1{font-size:60px;font-weight:600;letter-spacing:.02em;margin:0}.hero p{margin:0;font-size:17px;opacity:.92}
.hicons{display:flex;gap:12px;margin-top:22px}.hicons span{width:44px;height:44px;border:1.5px solid rgba(255,255,255,.7);border-radius:50%;display:flex;align-items:center;justify-content:center}
.hbtn{width:100%;max-width:360px;background:#fff;color:#3d5a50;border:0;border-radius:16px;padding:16px;font-size:18px;font-weight:600;cursor:pointer}
.lk{background:none;border:0;color:var(--ac);padding:0;font:inherit;font-weight:600;text-decoration:underline;cursor:pointer}
.x{padding:6px 10px}
#toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ac);color:var(--onac,var(--bg));padding:10px 18px;border-radius:99px;font-weight:600;display:none;z-index:9;max-width:90%;text-align:center}
.hgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:10px 0}.hb{aspect-ratio:1;border-radius:10px;border:1px solid var(--bd);background:none;color:var(--fg);font-size:14px;cursor:pointer;padding:0}.hb.on{background:var(--ac);color:var(--onac,var(--bg));border-color:var(--ac)}.hb.sk{border-style:dashed}.hb.sel{outline:2px solid var(--fg);outline-offset:1px}
.s3{grid-template-columns:repeat(3,1fr)}.ed{background:none;border:0;color:var(--fg);font:inherit;text-align:left;padding:6px 0;cursor:pointer;flex:1}
.sk{display:flex;align-items:center;justify-content:center;gap:12px;color:var(--fg)}.sk b{line-height:1;font-weight:700}.sk svg{display:block;flex:none}
.grid3 .stat{display:flex;flex-direction:column;align-items:center;justify-content:center}
.warn{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--fg);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:20;padding:24px}.dbox{background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:16px;padding:18px;max-width:340px;width:100%}.dbox p{margin:0 0 14px}
.sm{padding:4px 10px;font-size:13px}
#bn{max-width:560px;margin:0 auto;padding:16px 16px 0}#bn:empty{display:none}
/* Bottom tab bar */
#tabs{display:none;position:fixed;left:0;right:0;bottom:0;z-index:8;-webkit-transform:translateZ(0);transform:translateZ(0);will-change:transform;padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg);border-top:1px solid var(--bd)}

#tabs .tin{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));height:58px}
#tabs button{background:none;border:0;color:var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0 2px;font-size:11px;font-weight:500;cursor:pointer;min-width:0;-webkit-tap-highlight-color:transparent}
#tabs button span{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}

.pv{font-size:18px;margin:8px 0 0}
.card>b{display:block}.seg.s3{margin:8px 0 14px}.pzg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0 14px}.pz{background:none;border:0;padding:0;color:var(--fg);cursor:pointer;text-align:center;font-size:11px;min-width:0}.pzb{display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;aspect-ratio:1/1;border-radius:14px;border:1px solid var(--bd);padding:8px;margin-bottom:5px}.pzb i{width:60%;height:8px;border-radius:9px;display:block}.pzb b{font-size:16px;font-weight:600}.pz.on .pzb{outline:2px solid var(--fg);outline-offset:2px}.ad{width:32px;height:32px;border-radius:50%;border:1px solid var(--bd);padding:0;cursor:pointer;flex:none}.ad.on{outline:2px solid var(--fg);outline-offset:2px}

#undo{position:fixed;left:12px;right:12px;bottom:calc(var(--tbh,env(safe-area-inset-bottom,0px)) + 12px);max-width:520px;margin:0 auto;display:none;align-items:center;gap:12px;padding:12px 14px 16px 18px;border-radius:16px;background:rgba(var(--bgrgb,0,0,0),.96);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--bd);color:var(--fg);box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:15;overflow:hidden}
#undo.up{bottom:calc(var(--tbh,env(safe-area-inset-bottom,0px)) + 76px)}

@keyframes udrain{from{transform:scaleX(1)}to{transform:scaleX(0)}}
/* Theme packs */
h1,h2,.stat b,.hero h1{font-family:var(--fh,var(--ff))}
.thg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:10px 0 4px}.thk{background:none;border:0;padding:0;color:var(--fg);font-size:13px;text-align:center;cursor:pointer;min-width:0}.thv{display:block;height:84px;border-radius:16px;padding:12px;border:1px solid var(--bd);margin-bottom:5px}.thm{display:flex;align-items:center;gap:10px;height:100%;padding:0 14px}.thm b{font-size:24px;font-weight:600;line-height:1}.thm i{display:block;width:34px;height:8px;border-radius:9px;margin-left:auto}.thk.on .thv{outline:2px solid var(--fg);outline-offset:2px}
html[data-th] body{background:transparent}
html[data-th] body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:var(--pg)}

html[data-th=cartoon] :is(.card,.tile,.stat,.seg,.warn,.dbox,.mg button,.act){border:3px solid #141414;box-shadow:4px 4px 0 #141414}
html[data-th=cartoon] :is(.card,.tile,.stat,.warn,.dbox,.seg){border-radius:16px}

html[data-th=glass] :is(.card,.tile,.stat)::before{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;pointer-events:none;background:radial-gradient(130% 70% at 18% -10%,rgba(255,255,255,var(--gls)),transparent 55%),radial-gradient(90% 50% at 100% 110%,rgba(255,255,255,calc(var(--gls)*.45)),transparent 60%)}
html[data-th=glass] :is(.card,.tile,.stat)::after,html[data-th=glass] #tabs::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.95),rgba(255,255,255,.08) 38%,rgba(255,255,255,.06) 62%,rgba(255,255,255,.75));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
html[data-th=glass] :is(.btn,.chip.on,.seg button.on,.hb.on){background-image:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.05) 55%,rgba(255,255,255,.18));border-color:rgba(255,255,255,.55);box-shadow:inset 0 1px 1px rgba(255,255,255,.8),inset 0 -2px 6px rgba(255,255,255,.2),0 6px 18px rgba(var(--acrgb),.40)}
html[data-th=glass] :is(.btn,.ghost,.chip){border-radius:99px}

html[data-th=glass] :is(input,select,textarea){background:rgba(255,255,255,.14);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.35);border-radius:16px;box-shadow:inset 0 1px 3px rgba(0,0,0,.12),inset 0 1px 0 rgba(255,255,255,.3)}

 (ids.length?ids.map(id=>{const e=exn(id);return `<div class="card"><b>${esc(e.n)}</b>${e.note?noteH(e.note):''}${((S.xn||{})[d]||{})[id]?noteH(T('วันนั้น: ','That day: ')+S.xn[d][id]):''}${(wu[id]||[]).map((s,k)=>`<div class="row mut"><span style="flex:1">${T('วอร์มอัป','Warm-up')} ${k+1}: ${fmt(e,s)}</span><button class="x" onclick="hRmW('${d}','${id}',${k})">×</button></div>`).join('')}${w[id].map((s,k)=>`<div class="row"><span class="mut" style="width:48px;flex:none">${T('เซ็ต','Set')} ${k+1}</span><input type="number" inputmode="decimal" value="${s.a}" placeholder="${e.c=='time'?'min':'reps'}" onchange="hSet('${d}','${id}',${k},'a',this.value)">${e.c=='time'?'':`<input type="number" inputmode="decimal" value="${s.b||''}" placeholder="kg" onchange="hSet('${d}','${id}',${k},'b',this.value)">`}<button class="x" onclick="hRm('${d}','${id}',${k})">×</button></div>${s.n?noteH(s.n):''}`).join('')}</div>`}).join(''):`<p class="mut">${T('ไม่มีบันทึกออกกำลังกายวันนี้','No workout logged')}</p>`)+
 `<div class="card"><div class="mut" style="margin-bottom:6px">${T('เพิ่มเซ็ตย้อนหลัง','Add a set to this day')}</div><select id="hx"><option value="">${T('เลือกท่า','Pick exercise')}</option>${exOpts(S.ex)}</select><div class="row" style="margin-top:8px"><input id="ha" type="number" inputmode="decimal" placeholder="reps / min"><input id="hb" type="number" inputmode="decimal" placeholder="kg"><button class="btn" onclick="hAdd('${d}')">+</button></div></div>`;
}
const hSet=(d,id,k,f,v)=>{S.wk[d][id][k][f]=+v;save()};
async function hRm(d,id,k){if(!await askDel(T('ลบเซ็ตนี้','Delete this set')))return;S.wk[d][id].splice(k,1);if(!S.wk[d][id].length)delete S.wk[d][id];if(!Object.keys(S.wk[d]).length)delete S.wk[d];save();render()}
const hRmW=async(d,id,k)=>{if(!await askDel(T('ลบเซ็ตวอร์มอัปนี้','Delete this warm-up set')))return;S.wu[d][id].splice(k,1);save();render()};
function hAdd(d){const id=val('hx'),a=+val('ha'),b=+val('hb')||0;if(!id||!a)return;((S.wk[d]=S.wk[d]||{})[id]=S.wk[d][id]||[]).push({a,b});save();render()}
function gStreak(){
 const d=today(),sk=S.skip[d];
 return `<div class="card" style="text-align:center">${streakHTML(76,96)}<div class="mut" style="margin-top:6px">${T('วันต่อเนื่อง','day streak')}</div></div>${trainSummary()}
 <div class="card">${sk?`<div class="row"><span style="flex:1">${T('วันนี้เป็นวันพัก','Rest day today')}: ${esc(sk)}${rqS(d)}</span><button class="x" onclick="rmSkip('${d}')">×</button></div><div class="mut">${T('นับเข้า streak แล้ว','Counted in your streak')}</div>`:`${planRest(d)&&!trained(d)?`<div class="mut" style="margin-bottom:8px">${T('วันนี้เป็นวันพักตามแผน streak ไม่ขาด กดวันพักเพื่อนับเพิ่ม','Planned rest day. Your streak is safe. Tap Rest day to add it to your streak.')}</div>`:''}<div class="row"><input id="sr" placeholder="${T('เหตุผล ไม่ใส่ก็ได้','Reason, optional')}"><button class="btn" onclick="skipDay()">${T('วันพัก','Rest day')}</button></div><div class="mut" style="margin-top:6px">${T('กดวันพักแล้วนับเพิ่ม streak ระบบจะถามว่าพักผ่อนเพียงพอไหม','A rest day adds to your streak. You will be asked if you rested well.')}</div>`}</div>
 <div class="hgrid">${[...Array(28).keys()].reverse().map(n=>{const x=back(n);return `<button class="hb ${trained(x)?'on':isRest(x)?'sk':''} ${(hd||today())==x?'sel':''}" onclick="hd='${x}';render()">${+x.slice(8)}</button>`}).join('')}</div>${dayHist(hd||today())}
 ${Object.keys(S.skip).sort().reverse().slice(0,5).map(x=>`<div class="mut">${x}: ${esc(S.skip[x])}</div>`).join('')}`;
}
async function rmSkip(d){if(!await askDel(T('ลบเหตุผลที่พักวันนี้','Remove the rest-day reason')))return;delete S.skip[d];if(S.rq)delete S.rq[d];save();render()}
const RQL=()=>({g:T('พักดี','rested well'),m:T('พอใช้','so-so'),b:T('ยังไม่ค่อยดี','not really')});
const rqS=d=>S.rq&&S.rq[d]?' · '+RQL()[S.rq[d]]:'';
async function restAsk(d,reason){const i=await askC(T('พักผ่อนเพียงพอไหม','Did you rest well?'),[T('พักดี','Yes, rested well'),T('พอใช้','So-so'),T('ยังไม่ค่อยดี','Not really')]);if(i<0)return;S.skip[d]=reason||T('วันพัก','Rest day');S.rq=S.rq||{};S.rq[d]=['g','m','b'][i];save();render();toast(T('นับวันพักเข้า streak แล้ว','Rest day added to your streak'))}
async function skipDay(){const r=val('sr').trim();await restAsk(today(),r)}
const restOn=d=>restAsk(d,'')
/* Rest timer */
let AC=null,AUD=null,primed=false;
function wavBlob(){const sr=22050,seq=[[0,.16,880],[.24,.40,880],[.48,.72,1175]],n=Math.ceil(sr*.8),buf=new ArrayBuffer(44+n*2),v=new DataView(buf),w=(o,t)=>{for(let i=0;i<t.length;i++)v.setUint8(o+i,t.charCodeAt(i))};
 w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
 for(const [a,b,f] of seq)for(let i=Math.floor(a*sr);i<Math.min(n,Math.floor(b*sr));i++){const t=i/sr-a,d=b-a,env=Math.max(0,Math.min(1,t/.012,(d-t)/.02));v.setInt16(44+i*2,Math.round(32767*.85*env*(Math.sin(2*Math.PI*f*t)*.8+Math.sin(4*Math.PI*f*t)*.2)),true)}
 return new Blob([buf],{type:'audio/wav'})}
function sndAudio(){if(!AUD){try{AUD=new Audio(URL.createObjectURL(wavBlob()));AUD.preload='auto'}catch(e){}}return AUD}
function sessType(t){try{if(navigator.audioSession)navigator.audioSession.type=t}catch(e){}}
function unlockAudio(force){if(!S.snd&&!force)return;
 try{const C=typeof AudioContext!='undefined'?AudioContext:typeof webkitAudioContext!='undefined'?webkitAudioContext:null;if(C){AC=AC||new C();if(AC.state!='running')AC.resume()}}catch(e){}
 try{const a=sndAudio();if(a&&!primed){primed=true;a.muted=true;const p=a.play(),done=()=>{try{a.pause();a.currentTime=0;a.muted=false}catch(e){}};if(p&&p.then)p.then(done,()=>{primed=false;a.muted=false});else done()}}catch(e){}}
['touchend','pointerdown','click'].forEach(ev=>document.addEventListener(ev,()=>unlockAudio(),{passive:true}));
function webBeep(){if(!AC)return;try{if(AC.state!='running')AC.resume();[0,.24,.48].forEach((t,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=i==2?1175:880;g.gain.value=.5;o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+t);o.stop(AC.currentTime+t+.18)})}catch(e){}}
function beep(force){if(!S.snd&&!force)return;try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
 sessType('playback');const a=sndAudio();
 if(a){try{a.muted=false;a.volume=1;a.currentTime=0;const p=a.play();if(p&&p.then)p.then(()=>{},()=>webBeep())}catch(e){webBeep()}}else webBeep();
 setTimeout(()=>sessType('auto'),1600)}
const togSnd=()=>{S.snd=!S.snd;save();unlockAudio();if(S.snd)beep();render()};
const testSnd=()=>{unlockAudio(true);beep(true);toast(T('กำลังเล่นเสียง','Playing sound'))};
/* Keep the screen awake while a workout is running */
let WAKE=null,WAKEB=false;
const sesOn=()=>{const x=(S.ses||{})[today()];return !!(x&&!x.en)};
async function wakeSync(){const need=S.awake!==false&&sesOn();
 if(need&&!WAKE&&!WAKEB&&!document.hidden&&navigator.wakeLock){WAKEB=true;try{const l=await navigator.wakeLock.request('screen');WAKE=l;l.addEventListener('release',()=>{if(WAKE===l)WAKE=null})}catch(e){}WAKEB=false}
 else if(!need&&WAKE){const l=WAKE;WAKE=null;try{await l.release()}catch(e){}}}
const togAwake=()=>{S.awake=S.awake===false;save();wakeSync();render()};
document.addEventListener('visibilitychange',()=>{if(!document.hidden)wakeSync()});
['touchend','click'].forEach(ev=>document.addEventListener(ev,()=>{if(!WAKE&&S.awake!==false&&sesOn())wakeSync()},{passive:true}));
function rest(s){clearInterval(rt);if(!s){$('rest').style.display='none';return}
 unlockAudio();const end=Date.now()+s*1000;$('rest').style.display='block';
 const tick=()=>{const l=Math.ceil((end-Date.now())/1000);if(l<=0){clearInterval(rt);$('rt').textContent=T('พักครบแล้ว!','Rest over!');try{navigator.vibrate&&navigator.vibrate(300)}catch(e){}beep();setTimeout(()=>{$('rest').style.display='none'},3000);return}
  $('rt').textContent=Math.floor(l/60)+':'+String(l%60).padStart(2,'0')};
 tick();rt=setInterval(tick,250)}
/* Settings */
function settings(){
 const ci=(k,v)=>`<input type="color" value="${v}" style="width:64px;height:40px;padding:2px;flex:none" oninput="S.${k}=this.value;S.pre='custom';S.th='';applyTheme()" onchange="save();render()">`;
 return head(T('ตั้งค่า','Settings'),0,'set')+`${packCard()}${S.th?packColors():`<div class="card"><b>${T('โหมด','Mode')}</b>
  <div class="seg s3">${[['dark',T('มืด','Dark')],['light',T('สว่าง','Light')],['auto',T('ตามระบบ','Auto')]].map(x=>`<button class="${S.mode==x[0]?'on':''}" onclick="setMode('${x[0]}')">${x[1]}</button>`).join('')}</div>
  <b>${T('โทนสี','Colors')}</b>
  <div class="pzg">${PRE.map(p=>{const v=p[curMode()],tx=lum(v[0])<140?'#fff':'#0b1b3a';return `<button class="pz ${S.pre==p.k?'on':''}" onclick="setPre('${p.k}')"><span class="pzb" style="background:${v[0]};color:${tx}"><i style="background:${v[1]}"></i><b>Aa</b></span>${T(p.n[0],p.n[1])}</button>`}).join('')}</div>
  <b>${T('สีเน้น','Accent')}</b>
  <div class="chips" style="gap:10px;align-items:center"><button class="chip ${S.pre!='custom'&&!S.acc?'on':''}" onclick="setAcc('')">${T('ตามธีม','Theme')}</button>${ACC.map(a=>`<button class="ad ${S.acc==a.k&&S.pre!='custom'?'on':''}" style="background:${curMode()=='dark'?a.d:a.l}" onclick="setAcc('${a.k}')" aria-label="${a.k}"></button>`).join('')}</div>
  <details style="margin-top:12px" ${S.pre=='custom'?'open':''}><summary class="mut" style="cursor:pointer">${T('ปรับสีเอง','Custom colors')}</summary>
   <div class="row"><span style="flex:1">${T('สีพื้นหลัง','Background')}</span>${ci('cbg',S.cbg||'#000000')}</div>
   <div class="row"><span style="flex:1">${T('สีเน้น','Accent')}</span>${ci('cac',S.cac||'#ffffff')}</div>
   <p class="mut">${T('ถ้าสีเน้นอ่านยากบนพื้นหลัง แอปจะปรับความสว่างให้อ่านออกอัตโนมัติ','If the accent is hard to read on the background, the app adjusts its brightness automatically.')}</p>
   <button class="ghost" onclick="S.pre='mono';S.mode='dark';S.acc='';S.th='';save();render()">${T('รีเซ็ตเป็นค่าเริ่มต้น','Reset to default')}</button></details></div>`}
 <div class="card"><b>${T('ฟอนต์','Font')}</b><div class="chips">${FONTS.map(f=>{loadFont(f);return `<button class="chip ${(S.font||'prompt')==f.k?'on':''}" style="font-family:${fam(f)}" onclick="setLook('font','${f.k}')">${f.n}</button>`}).join('')}</div><p class="pv">${T('ตัวอย่าง กขค 0123 Aa','Preview กขค 0123 Aa')}</p></div>
 ${S.th?'':`<div class="card"><b>${T('สไตล์','Style')}</b><div class="chips">${STY.map(y=>`<button class="chip ${(S.sty||'round')==y[0]?'on':''}" onclick="setLook('sty','${y[0]}')">${T(y[1][0],y[1][1])}</button>`).join('')}</div><p class="mut">${T(STY.find(y=>y[0]==(S.sty||'round'))[2][0],STY.find(y=>y[0]==(S.sty||'round'))[2][1])}</p></div>`}
 <div class="card"><div class="row"><b style="flex:1">${T('เสียงเตือนตอนพักจบ','Rest-end alarm')}</b><button class="ghost" onclick="testSnd()">${T('ทดสอบ','Test')}</button><button class="chip ${S.snd?'on':''}" onclick="togSnd()">${S.snd?T('เปิด','On'):T('ปิด','Off')}</button></div><p class="mut" style="margin:8px 0 0">${T('ไม่ได้ยินเสียง? เปิดเสียงเครื่อง ปิดโหมดเงียบ แล้วกดทดสอบหนึ่งครั้ง','No sound? Turn the volume up, switch off Silent mode, then tap Test once.')}</p></div>
  <div class="card row"><span style="flex:1"><b>${T('เปิดหน้าจอค้างตอนออกกำลังกาย','Keep screen on during workouts')}</b></span><button class="chip ${S.awake!==false?'on':''}" onclick="togAwake()">${S.awake!==false?T('เปิด','On'):T('ปิด','Off')}</button></div>
 ${quoteSettings()}
 <div class="card"><b>${T('ภาษา','Language')}</b><div class="chips"><button class="chip ${S.lang=='th'?'on':''}" onclick="S.lang='th';save();render()">ไทย</button><button class="chip ${S.lang=='en'?'on':''}" onclick="S.lang='en';save();render()">English</button></div></div>
 <div class="card"><b>${T('เป้าโภชนาการต่อวัน','Daily nutrition goals')}</b><div class="row" style="margin-top:8px"><input id="kg" type="number" value="${S.kgoal}" placeholder="kcal"><input id="pg" type="number" value="${S.pg||''}" placeholder="P g"><input id="cg" type="number" value="${S.cg||''}" placeholder="C g"><input id="fg" type="number" value="${S.fg||''}" placeholder="F g"></div><button class="btn" onclick="S.kgoal=+val('kg')||2000;S.pg=+val('pg')||0;S.cg=+val('cg')||0;S.fg=+val('fg')||0;save();render()">OK</button></div>
 <div class="card"><b>${T('สำรองข้อมูล','Backup')}</b><p class="mut">${T('คัดลอกข้อมูลไปอีกเครื่องด้วยมือ','Copy your data to another device manually')}</p>
 <textarea id="bk" placeholder="${T('สำรอง/ย้ายข้อมูลด้วยมือ','Manual backup / transfer')}"></textarea><div class="row"><button class="ghost" onclick="$('bk').value=JSON.stringify(S)">${T('ส่งออก','Export')}</button><button class="ghost" onclick="impD()">${T('นำเข้า','Import')}</button></div>
 <div class="row"><button class="ghost" onclick="exportFile()">${T('ส่งออกเป็นไฟล์','Export as file')}</button><label class="ghost" style="cursor:pointer;text-align:center">${T('นำเข้าจากไฟล์','Import file')}<input type="file" accept=".json,application/json" style="display:none" onchange="importFile(this)"></label></div></div>
 ${storageCard()}
 <div class="card"><b>${T('ชื่อ','Name')}</b><div class="row" style="margin-top:8px"><input id="un" value="${esc(S.user.n)}"><button class="btn" onclick="S.user.n=val('un').trim()||S.user.n;save();render()">OK</button></div></div>
 ${S.local?`<div class="card"><b>${T('ใช้ในเครื่องนี้','This device only')}</b><p class="mut">${T('ข้อมูลไม่ซิงค์ ควรสำรองไฟล์เป็นระยะ','Data does not sync. Back up regularly.')}</p><button class="btn" style="width:100%" onclick="V='auth';render()">${T('สมัครหรือเข้าสู่ระบบเพื่อซิงค์','Sign up or log in to sync')}</button></div>`:`<div class="card row"><span style="flex:1">${esc(EM)}<br><span class="mut">${SYNC=='ok'?T('ซิงค์แล้ว','Synced')+(SYNCAT?' '+new Date(SYNCAT).toTimeString().slice(0,5):''):SYNC=='err'?T('ซิงค์ไม่สำเร็จ','Sync error'):''}</span></span><button class="ghost" onclick="syncNow()">${T('ซิงค์','Sync')}</button><button class="ghost" onclick="logout()">${T('ออกจากระบบ','Log out')}</button></div>`}`;
}
function impD(){try{const o=JSON.parse(val('bk'));S=Object.assign(S,o);S.logged=true;save();render()}catch(e){toast(T('ข้อมูลไม่ถูกต้อง','Invalid data'))}}
setTimeout(()=>{QUOTA=probeQuota();refreshBanner()},3000);
render();boot();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
