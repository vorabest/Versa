<html lang="th">
<head>

<link rel="apple-touch-icon" href="icon-180.png">

<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--fg:#fff;--card:rgba(255,255,255,.08);--mut:rgba(255,255,255,.62);--ac:#fff;--bd:rgba(255,255,255,.16);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=black]{--bg:#0c0c0e;--card:rgba(255,255,255,.07);--ac:#c9c9d1}
:root[data-theme=light]{--bg:#f4f6fb;--fg:#0b1b3a;--card:rgba(11,27,58,.06);--mut:rgba(11,27,58,.6);--ac:#2457d6;--bd:rgba(11,27,58,.16)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:"Prompt",system-ui,-apple-system,"Noto Sans Thai",sans-serif;font-size:16px;line-height:1.45}
#app{max-width:560px;margin:0 auto;padding:16px 16px 120px}
h1{font-size:34px;line-height:1.15;margin:0 0 4px;font-weight:700}h2{font-size:24px;margin:20px 0 8px;font-weight:600}.card>.row>b,.card>b{font-size:18px;font-weight:600}.chip{font-size:15px;padding:8px 14px}
.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px 14px;text-align:left;color:var(--fg);font-size:17px;cursor:pointer;min-height:92px}
.tile small{display:block;color:var(--mut);font-size:13px;margin-top:4px}
button,input,select,textarea{font:inherit;color:var(--fg)}
input,select,textarea{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;width:100%;min-width:0}
select option{color:#000}
.btn{background:var(--ac);color:var(--onac,var(--bg));border:0;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer}
.ghost{background:none;border:1px solid var(--bd);color:var(--fg);border-radius:10px;padding:8px 12px;cursor:pointer}
.row{display:flex;gap:8px;align-items:center;margin:6px 0}.row>*{flex:0 1 auto}.row>input,.row>select{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{border:1px solid var(--bd);border-radius:99px;padding:6px 12px;background:none;cursor:pointer}
.chip.on{background:var(--ac);color:var(--onac,var(--bg));border-color:var(--ac)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:8px}.top .ghost{padding:6px 12px}
.done{text-decoration:line-through;opacity:.5}
.bar{height:8px;background:var(--card);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.x{background:none;border:0;color:var(--mut);cursor:pointer;font-size:18px}
.cover{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
#rest{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--bd);display:none}
#rest .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px}
#rest b{font-size:26px;font-variant-numeric:tabular-nums;flex:1}
.dots{display:flex;gap:4px}.dots i{width:14px;height:14px;border-radius:4px;background:var(--card);border:1px solid var(--bd)}.dots i.on{background:var(--ac);border-color:var(--ac)}.dots i.sk{background:none;border-style:dashed}
input[type=range]{padding:0}input[type=checkbox]{width:22px;height:22px;flex:none}
.mz{fill:var(--c,var(--ac));fill-opacity:.55;stroke:var(--bg);stroke-width:1.2;cursor:pointer;transition:fill-opacity .15s}.mz.on{fill-opacity:1;stroke:var(--fg);stroke-width:2}.mz:active{fill-opacity:.8}.ln{fill:none;stroke:var(--bg);stroke-opacity:.55;stroke-width:1.2;pointer-events:none}.nz{fill:var(--card);stroke:var(--bd);stroke-width:1}.top svg{flex:none;color:var(--ac)}.tile svg{color:var(--ac)}textarea{min-height:90px;width:100%}
.nav5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:18px 0}.nav5 button{aspect-ratio:1/1.2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:16px;color:var(--fg);font-size:12px;font-weight:600;padding:6px 2px;cursor:pointer}.nav5 svg{color:var(--ac)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 8px;text-align:center;cursor:pointer}.stat b{display:block;font-size:32px;font-weight:700;line-height:1.1}.stat span{font-size:12px;color:var(--mut)}
.sets{border-top:1px solid var(--bd);margin-top:8px;padding-top:6px}.act{background:var(--card);border-radius:10px;padding:8px;margin:6px 0}
.seg{display:grid;gap:4px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:4px;margin:10px 0}.s5{grid-template-columns:repeat(5,1fr)}.s7{grid-template-columns:repeat(7,1fr)}.seg button{border:0;background:none;color:var(--fg);border-radius:10px;padding:10px 0;font-size:13px;cursor:pointer;min-width:0}.seg button.on{background:var(--ac);color:var(--onac,var(--bg));font-weight:600}.seg sup{font-size:9px;margin-left:1px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;margin-top:8px}.cal small{color:var(--mut);font-size:12px}.cal i{display:block}.cd{aspect-ratio:1;border-radius:10px;border:1px solid transparent;background:none;color:var(--fg);font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;padding:0;gap:2px}.cd.tdy{border-color:var(--ac)}.cd.sel{background:var(--ac);color:var(--onac,var(--bg))}.cd span{display:flex;gap:2px;height:5px}.cd u{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.85}.cd u.w{border-radius:1px}
.mg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.mg button{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 4px;color:var(--fg);font-size:15px;font-weight:600;cursor:pointer}.mg button small{display:block;font-weight:400;color:var(--mut);font-size:11px}.mg button.on{background:var(--ac);color:var(--onac,var(--bg))}.mg button.on small{color:inherit}
.s2{grid-template-columns:repeat(2,1fr)}
.hero{position:fixed;inset:0;z-index:5;background:linear-gradient(165deg,#7f9d8e 0%,#6a8aa0 100%);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(40px + env(safe-area-inset-top,0px)) 24px calc(32px + env(safe-area-inset-bottom,0px));text-align:center}
.hmid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}.hero h1{font-size:60px;font-weight:600;letter-spacing:.02em;margin:0}.hero p{margin:0;font-size:17px;opacity:.92}
.hicons{display:flex;gap:12px;margin-top:22px}.hicons span{width:44px;height:44px;border:1.5px solid rgba(255,255,255,.7);border-radius:50%;display:flex;align-items:center;justify-content:center}
.hbtn{width:100%;max-width:360px;background:#fff;color:#3d5a50;border:0;border-radius:16px;padding:16px;font-size:18px;font-weight:600;cursor:pointer}
.lk{background:none;border:0;color:var(--ac);padding:0;font:inherit;font-weight:600;text-decoration:underline;cursor:pointer}
.x{padding:6px 10px}
#toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ac);color:var(--onac,var(--bg));padding:10px 18px;border-radius:99px;font-weight:600;display:none;z-index:9;max-width:90%;text-align:center}
.hgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:10px 0}.hb{aspect-ratio:1;border-radius:10px;border:1px solid var(--bd);background:none;color:var(--fg);font-size:14px;cursor:pointer;padding:0}.hb.on{background:var(--ac);color:var(--onac,var(--bg));border-color:var(--ac)}.hb.sk{border-style:dashed}.hb.sel{outline:2px solid var(--fg);outline-offset:1px}
.s3{grid-template-columns:repeat(3,1fr)}.ed{background:none;border:0;color:var(--fg);font:inherit;text-align:left;padding:6px 0;cursor:pointer;flex:1}
.sk{display:flex;align-items:center;justify-content:center;gap:12px;color:var(--fg)}.sk b{line-height:1;font-weight:700}.sk svg{display:block;flex:none}
.grid3 .stat{display:flex;flex-direction:column;align-items:center;justify-content:center}
.warn{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--fg);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<div id="rest"><div class="in"><b id="rt">0:00</b><button class="ghost" onclick="rest(0)">Stop</button></div></div>
<script>
const K='helper_v1';let S={};
try{S=JSON.parse(localStorage.getItem(K))||{}}catch(e){}
S=Object.assign({user:null,logged:false,ses:{},wu:{},snd:true,sl:[],sgoal:8,sp:null,pg:0,cg:0,fg:0,bw:[],bgoal:0,theme:'navy',cbg:'#000000',cac:'#ffffff',lang:'th',tasks:[],goals:[],glog:{},
ex:[{id:'e1',n:'Bench Press',c:'reps',m:'chest',t:'free'},{id:'e2',n:'Bicep Curl',c:'reps',m:'bicep',t:'free'},{id:'e3',n:'Squat',c:'reps',m:'legs',t:'free'},{id:'e4',n:'Running',c:'time',m:'cardio',t:'body'}],
plans:[],main:null,wk:{},food:[],kgoal:2000,skip:{}},S);
let syncT=null;
let saveFail=false,USED=0,QUOTA=5e6,bnHide=false;
function store(){const j=JSON.stringify(S);USED=j.length;try{localStorage.setItem(K,j);saveFail=false}catch(e){saveFail=true}}
const save=()=>{S.ts=Date.now();store();clearTimeout(syncT);syncT=setTimeout(push,1500)};
try{USED=(localStorage.getItem(K)||'').length}catch(e){}
const SB_URL='https://wgpvgmnsrencoxogevti.supabase.co',SB_KEY='sb_publishable_FzYwg0GyqtgjbchTEwCpDA_IRO2Wo6I';
const sb=(window.supabase&&supabase.createClient)?supabase.createClient(SB_URL,SB_KEY):null;
let UID=null,EM='',SYNC='',REC=false,busy=false;
const persist=store;
const hasData=()=>S.tasks.length||S.goals.length||S.food.length||S.bw.length||S.plans.length||Object.keys(S.wk).length||S.ex.length>4;
async function push(){if(!sb||!UID)return;try{const {error}=await sb.from('app_state').upsert({user_id:UID,data:S,updated_at:new Date().toISOString()});SYNC=error?'err':'ok'}catch(e){SYNC='err'}}
async function pull(){
 if(!sb||!UID)return;
 try{
  const {data,error}=await sb.from('app_state').select('data').eq('user_id',UID).maybeSingle();
  if(error)throw error;
  if(!data){S.uid=UID;save();await push();return}
  const r=data.data||{},apply=()=>{S=Object.assign({},S,r);S.uid=UID;persist()};
  if(S.uid==UID){if((r.ts||0)>(S.ts||0))apply();else if((S.ts||0)>(r.ts||0))await push()}
  else if(!hasData()||confirm(T('มีข้อมูลบนเซิร์ฟเวอร์แล้ว ตกลง = ใช้ข้อมูลจากเซิร์ฟเวอร์ ยกเลิก = ใช้ข้อมูลในเครื่องนี้','Server already has data. OK = use server data, Cancel = use this device')))apply();
  else{S.uid=UID;save();await push()}
  SYNC='ok'
 }catch(e){SYNC='err'}
}
const T=(th,en)=>S.lang=='th'?th:en;
const $=id=>document.getElementById(id), val=id=>($(id)||{}).value||'';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const today=()=>iso(new Date());
const back=n=>{const d=new Date();d.setDate(d.getDate()-n);return iso(d)};
const uid=()=>Math.random().toString(36).slice(2,9);
let V='boot',G='workout',mode='',selPlan=null,ppOpen='',pm='',pe='',restLen=60,rt=null;
const MUS=['chest','shoulder','bicep','tricep','forearm','abs','quads','hamstring','glutes','calf','trap','back','cardio'];
const MTH={chest:'อก',shoulder:'ไหล่',bicep:'ไบเซป',tricep:'ไตรเซป',forearm:'ปลายแขน',abs:'หน้าท้อง',quads:'ต้นขาหน้า',hamstring:'ต้นขาหลัง',glutes:'สะโพก',calf:'น่อง',trap:'ทราพีเซียส',back:'หลัง',cardio:'คาร์ดิโอ'};
const TYP={machine:['เครื่อง','Machine'],body:['น้ำหนักตัว','Body weight'],free:['ฟรีเวท','Free weight']};
const mn=m=>S.lang=='th'?MTH[m]:m[0].toUpperCase()+m.slice(1);
const go=v=>{V=v;render()};
const logo='<svg width="84" height="84" viewBox="0 0 76 76" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="64" height="64" rx="18"/><path d="M24 28L38 50L52 28"/></svg>';

const IC={cal:'<rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',goal:'<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1"/>',gym:'<path d="M6 8v8M18 8v8M3 10v4M21 10v4M6 12h12"/>',food:'<path d="M12 7c-2-2-7-1-7 5 0 4 3 8 5 8 1 0 1.2-.6 2-.6s1 .6 2 .6c2 0 5-4 5-8 0-6-5-7-7-5z"/><path d="M12 7c0-2 1-3 3-4"/>',set:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>'};
const ico=(k,s=24)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${IC[k]}</svg>`;
IC.health='<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>';
const head=(t,b,i)=>`<div class="top"><button class="ghost" onclick="${b||"go('home')"}">←</button>${i?ico(i,28):''}<h1>${t}</h1></div>`;
const lum=c=>{const n=parseInt(c.slice(1),16);return((n>>16)*299+(n>>8&255)*587+(n&255)*114)/1000};
function applyTheme(){const c=S.cbg||'#000000',a=S.cac||'#ffffff',dk=lum(c)<140,r=document.documentElement.style,P=(k,v)=>r.setProperty(k,v);
 P('--bg',c);P('--ac',a);P('--onac',lum(a)<140?'#fff':'#0b1b3a');P('--fg',dk?'#fff':'#0b1b3a');
 P('--card',dk?'rgba(255,255,255,.08)':'rgba(11,27,58,.06)');P('--mut',dk?'rgba(255,255,255,.62)':'rgba(11,27,58,.6)');P('--bd',dk?'rgba(255,255,255,.16)':'rgba(11,27,58,.16)')}

function render(){
 applyTheme();document.documentElement.lang=S.lang;
 let h='';
 if(V=='cover')h=`<div class="hero"><div class="hmid">${logo}<h1>Versa</h1><p>${T('จัดการทุกอย่างในที่เดียว','Everything, in one place')}</p><div class="hicons">${['cal','goal','gym','food','set'].map(k=>`<span>${ico(k,22)}</span>`).join('')}</div></div><button class="hbtn" onclick="go(S.user?'home':'auth')">${T('เริ่มใช้งาน','Get started')}</button></div>`;
 else if(V=='auth')h=auth();
 else if(V=='boot')h=`<div class="cover">${logo}</div>`;
 else if(V=='newpw')h=newpw();
 else if(V=='home')h=home();
 else if(V=='plan')h=planner();
 else if(V=='goal')h=goals();
 else if(V=='gym')h=gym();
 else if(V=='food')h=food();
 else if(V=='set')h=settings();
 $('app').innerHTML=banner()+h;
}
let aMode='in',aMsg='',aE='';
const say=t=>{aMsg=t;const m=$('am');if(m)m.textContent=t};
const keepA=()=>{aE=val('ae')};
const errT=m=>/Invalid login/i.test(m)?T('อีเมลหรือรหัสผ่านไม่ถูกต้อง','Wrong email or password'):/not confirmed/i.test(m)?T('ยังไม่ได้ยืนยันอีเมล เช็กกล่องจดหมาย','Email not confirmed yet'):/already registered/i.test(m)?T('อีเมลนี้สมัครแล้ว','Email already registered'):m;
function auth(){
 const up=aMode=='up';
 return `<div class="cover">${logo}<h1>${up?T('สมัครสมาชิก','Sign up'):T('เข้าสู่ระบบ','Log in')}</h1>
 <div style="width:100%">${up?`<input id="an" placeholder="${T('ชื่อ','Name')}" style="margin-bottom:8px">`:''}
 <input id="ae" type="email" autocomplete="email" placeholder="${T('อีเมล','Email')}" value="${esc(aE)}" style="margin-bottom:8px">
 <input id="ap" type="password" autocomplete="${up?'new-password':'current-password'}" placeholder="${T('รหัสผ่าน','Password')}" style="margin-bottom:8px" onkeydown="if(event.key=='Enter')doAuth()">
 <button class="btn" style="width:100%" onclick="doAuth()">${up?T('สมัคร','Sign up'):T('เข้าสู่ระบบ','Log in')}</button>
 <p id="am" class="mut">${esc(aMsg)}</p>
 <p class="mut" style="margin:16px 0 6px;font-size:15px">${up?T('มีบัญชีแล้ว?','Already have an account?'):T('ยังไม่มีบัญชี?','No account yet?')} <button class="lk" onclick="keepA();aMode='${up?'in':'up'}';aMsg='';render()">${up?T('เข้าสู่ระบบ','Log in'):T('สมัครสมาชิก','Create account')}</button></p>
 ${up?'':`<p class="mut" style="margin:6px 0;font-size:15px">${T('ลืมรหัสผ่าน?','Forgot your password?')} <button class="lk" onclick="forgot()">${T('รีเซ็ต','Reset it')}</button></p>`}
 <div class="row" style="justify-content:center;margin-top:12px"><button class="ghost" onclick="keepA();S.lang='th';save();render()">ไทย</button><button class="ghost" onclick="keepA();S.lang='en';save();render()">EN</button></div></div></div>`;
}
async function doAuth(){
 if(!sb)return say(T('เชื่อมเซิร์ฟเวอร์ไม่ได้ ตรวจอินเทอร์เน็ตแล้วโหลดใหม่','Cannot reach server. Check your connection and reload'));
 const e=val('ae').trim(),p=val('ap'),up=aMode=='up';aE=e;
 if(!e||p.length<6)return say(T('ใส่อีเมลและรหัสผ่านอย่างน้อย 6 ตัว','Enter an email and a password of 6+ characters'));
 say(T('กำลังดำเนินการ','Working...'));
 try{
  if(up){const nm=val('an').trim();if(nm){S.user={n:nm};save()}
   const {data,error}=await sb.auth.signUp({email:e,password:p,options:{emailRedirectTo:location.origin+location.pathname}});
   if(error)return say(errT(error.message));
   if(data.session)return afterLogin(data.user);
   say(T('ส่งอีเมลยืนยันแล้ว เปิดลิงก์ในอีเมลก่อน แล้วกลับมาเข้าสู่ระบบ','Confirmation email sent. Open its link, then log in'));
  }else{const {data,error}=await sb.auth.signInWithPassword({email:e,password:p});if(error)return say(errT(error.message));afterLogin(data.user)}
 }catch(x){say(T('เชื่อมต่อไม่ได้','Connection failed'))}
}
async function forgot(){const e=val('ae').trim();if(!e)return say(T('ใส่อีเมลก่อน','Enter your email first'));
 try{const {error}=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.origin+location.pathname});say(error?errT(error.message):T('ส่งลิงก์รีเซ็ตรหัสผ่านแล้ว เช็กอีเมล','Reset link sent. Check your email'))}catch(x){say(T('เชื่อมต่อไม่ได้','Connection failed'))}}
function newpw(){return `<div class="cover">${logo}<h1>${T('ตั้งรหัสผ่านใหม่','New password')}</h1><div style="width:100%"><input id="np" type="password" autocomplete="new-password" placeholder="${T('รหัสผ่านใหม่','New password')}" style="margin-bottom:8px"><button class="btn" style="width:100%" onclick="setPw()">OK</button><p id="am" class="mut"></p></div></div>`}
async function setPw(){const p=val('np');if(p.length<6)return say(T('อย่างน้อย 6 ตัว','At least 6 characters'));
 const {data,error}=await sb.auth.updateUser({password:p});if(error)return say(errT(error.message));REC=false;afterLogin(data.user)}
async function afterLogin(u){
 if(busy||(UID==u.id&&V=='home'))return;busy=true;
 try{UID=u.id;EM=u.email||'';if(REC){V='newpw';render();return}
  await pull();if(!S.user||!S.user.n){S.user={n:EM.split('@')[0]||'me'};save()}
  V='home';render()}finally{busy=false}
}
async function boot(){
 if(!sb){V=S.user?'home':'auth';return render()}
 try{const {data}=await sb.auth.getSession(),se=data&&data.session;if(se)return afterLogin(se.user);V=(S.uid&&!navigator.onLine)?'home':'auth'}
 catch(e){V=S.uid?'home':'auth'}
 render();
}
async function logout(){
 if(!confirm(T('ออกจากระบบ ข้อมูลในเครื่องนี้จะถูกล้าง ข้อมูลบนเซิร์ฟเวอร์ยังอยู่','Log out? Data on this device will be cleared. The server copy stays.')))return;
 await push();if(SYNC=='err')return alert(T('ซิงค์ไม่สำเร็จ จึงยังไม่ออกจากระบบ','Sync failed, so you were not logged out'));
 try{await sb.auth.signOut()}catch(e){}try{localStorage.removeItem(K)}catch(e){}location.reload();
}
async function syncNow(){await pull();render()}
if(sb)sb.auth.onAuthStateChange((ev,se)=>{
 if(ev=='PASSWORD_RECOVERY'){REC=true;V='newpw';render()}
 else if(ev=='SIGNED_IN'&&se&&!REC)setTimeout(()=>afterLogin(se.user),0);
 else if(ev=='SIGNED_OUT')UID=null;
});
document.addEventListener('visibilitychange',async()=>{if(!UID||V=='auth'||V=='boot'||V=='newpw')return;if(document.hidden){clearTimeout(syncT);push()}else{const b=S.ts;await pull();if(S.ts!=b)render()}});
let cm=new Date().getFullYear()*12+new Date().getMonth(),selD=today();
function cal(){
 const y=Math.floor(cm/12),m=cm%12,off=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate();let c='';
 for(let i=0;i<off;i++)c+='<i></i>';
 for(let d=1;d<=n;d++){const k=iso(new Date(y,m,d)),tk=tasksOn(k).length>0||S.goals.some(g=>g.mode=='due'&&g.due==k);
  c+=`<button class="cd ${k==today()?'tdy':''} ${k==selD?'sel':''}" onclick="keep();selD='${k}';render()">${d}<span>${tk?'<u></u>':''}${trained(k)?'<u class="w"></u>':''}</span></button>`}
 return `<div class="row"><button class="ghost" onclick="keep();cm--;render()">‹</button><b style="flex:1;text-align:center;font-size:18px">${new Date(y,m,1).toLocaleDateString(S.lang=='th'?'th-TH':'en-US',{month:'long',year:'numeric'})}</b><button class="ghost" onclick="keep();cm++;render()">›</button></div><div class="cal">${DN().map(x=>`<small>${x}</small>`).join('')}${c}</div><div class="mut" style="margin-top:8px">● ${T('งาน/กำหนดส่ง','Task/deadline')} &nbsp; ■ ${T('ออกกำลังกาย','Workout')}</div>`;
}
let dT='',dN='',dR='';
const recurs=(t,k)=>{if(!t.r||k<t.d)return false;const a=new Date(t.d+'T00:00'),b=new Date(k+'T00:00'),df=Math.round((b-a)/864e5),g=b.getDay();return t.r=='d'||(t.r=='x'&&g>=1&&g<=5)||(t.r=='w'&&df%7==0)||(t.r=='m'&&a.getDate()==b.getDate())};
const tasksOn=k=>S.tasks.filter(t=>t.r?recurs(t,k):t.d==k);
const isDone=(t,k)=>t.r?!!(t.dn&&t.dn[k]):!!t.done;
const dueCount=()=>{const d=today();return S.tasks.filter(t=>!t.r&&!t.done&&t.d<d).length+tasksOn(d).filter(t=>!isDone(t,d)).length};
const RL={d:['ทุกวัน','Daily'],x:['จันทร์–ศุกร์','Weekdays'],w:['ทุกสัปดาห์','Weekly'],m:['ทุกเดือน','Monthly']};
const keep=()=>{if($('qt')){dT=val('qt');dN=val('qn');dR=val('qr')}};
const dim=(y,m)=>new Date(y,m,0).getDate();
function chDate(){keep();const y=+val('sy'),m=+val('sm'),d=Math.min(+val('sd'),dim(y,m));selD=iso(new Date(y,m-1,d));cm=y*12+m-1;render()}
function dayDetail(k,add){
 const ts=tasksOn(k),w=trained(k),sk=S.skip[k],kc=foodTotal(k),[Y,M,D]=k.split('-').map(Number),loc=S.lang=='th'?'th-TH':'en-US',y0=new Date().getFullYear();
 const list=ts.map(t=>`<div class="card row" style="align-items:flex-start"><input type="checkbox" ${isDone(t,k)?'checked':''} onchange="tg('${t.id}','${k}')"><div style="flex:1" class="${isDone(t,k)?'done':''}"><b>${esc(t.t)}</b>${t.r?` <span class="mut">↻ ${RL[t.r][S.lang=='th'?0:1]}</span>`:''}${t.n?`<div class="mut" style="white-space:pre-wrap">${esc(t.n)}</div>`:''}</div><button class="x" onclick="rmTask('${t.id}')">×</button></div>`).join('')||`<p class="mut">${T('ยังไม่มีงานในวันนี้','No tasks this day')}</p>`;
 const info=[w?'✓ '+T('ออกกำลังกาย','Workout'):sk?T('พัก','Rest')+': '+esc(sk):'',kc?kc+' kcal':''].filter(Boolean).join(' · ');
 const yrs=[];for(let y=Math.min(y0-2,Y);y<=Math.max(y0+5,Y);y++)yrs.push(y);
 const form=add?`<div class="card"><div class="mut" style="margin-bottom:6px">${T('วันที่','Date')}</div><div class="row"><select id="sd" onchange="chDate()">${[...Array(dim(Y,M)).keys()].map(i=>`<option ${i+1==D?'selected':''}>${i+1}</option>`).join('')}</select><select id="sm" onchange="chDate()">${[...Array(12).keys()].map(i=>`<option value="${i+1}" ${i+1==M?'selected':''}>${new Date(2000,i,1).toLocaleDateString(loc,{month:'long'})}</option>`).join('')}</select><select id="sy" onchange="chDate()">${yrs.map(y=>`<option ${y==Y?'selected':''}>${y}</option>`).join('')}</select></div>
 <input id="qt" placeholder="${T('หัวข้อ','Topic')}" value="${esc(dT)}" style="margin:8px 0"><textarea id="qn" placeholder="${T('เนื้อหา / รายละเอียด','Details')}">${esc(dN)}</textarea><select id="qr" style="margin-top:8px"><option value="" ${dR==''?'selected':''}>${T('ไม่ซ้ำ','No repeat')}</option>${Object.keys(RL).map(k=>`<option value="${k}" ${dR==k?'selected':''}>${T('ซ้ำ','Repeat')} ${RL[k][S.lang=='th'?0:1]}</option>`).join('')}</select><button class="btn" style="width:100%;margin-top:8px" onclick="addTask()">+ ${T('เพิ่มงาน','Add task')}</button></div>`:'';
 return `<h2>${k==today()?T('วันนี้','Today'):k}</h2>`+form+list+(info?`<div class="mut">${info}</div>`:'');

let toastT;const toast=t=>{const e=$('toast');if(!e)return;e.textContent=t;e.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>{e.style.display='none'},3500)};
let wkOff=0;
function weekCard(){
 const days=[...Array(7).keys()].map(i=>back(i+7*wkOff)),pdays=[...Array(7).keys()].map(i=>back(i+7*(wkOff+1)));
 const wd=days.filter(trained).length,fd=days.filter(d=>foodTotal(d)>0),avg=k=>fd.length?Math.round(fd.reduce((a,d)=>a+macT(d)[k],0)/fd.length):0;
 const wavg=ds=>{const a=S.bw.filter(x=>ds.includes(x.d));return a.length?a.reduce((t,x)=>t+x.w,0)/a.length:null};
 const w1=wavg(days),w0=wavg(pdays),dw=w1!=null&&w0!=null?w1-w0:null;
 const sl=S.sl.filter(e=>days.includes(e.d)),sa=sl.length?Math.round(sl.reduce((t,e)=>t+sdur(e),0)/sl.length):0;
 const dg=S.goals.filter(g=>g.mode!='due'),gp=dg.length?Math.round(days.reduce((t,d)=>t+dg.reduce((u,g)=>u+Math.min(100,gv(g.id,d)),0)/dg.length,0)/7):null;
 const cell=(v,l)=>`<div class="stat" style="cursor:default"><b style="font-size:24px">${v}</b><span>${l}</span></div>`;
 const wv=w1==null?'-':w1.toFixed(1)+(dw==null?'':` <small style="font-size:12px;font-weight:500;color:var(--mut)">(${dw>0?'+':''}${dw.toFixed(1)})</small>`);
 return `<h2>${T('สรุปสัปดาห์','Weekly summary')}</h2><div class="seg s2"><button class="${wkOff?'':'on'}" onclick="wkOff=0;render()">${T('7 วันล่าสุด','Last 7 days')}</button><button class="${wkOff?'on':''}" onclick="wkOff=1;render()">${T('7 วันก่อนหน้า','Previous 7')}</button></div>
 <div class="grid3">${cell(wd+'/7',T('วันออกกำลัง','Workout days'))}${cell(sa?Math.floor(sa/60)+'h '+(sa%60)+'m':'-',T('นอนเฉลี่ย','Sleep avg'))}${cell(gp==null?'-':gp+'%',T('เป้าหมายรายวัน','Daily goal'))}</div>
 <div class="grid3" style="margin-top:8px">${cell(avg('k')||'-','kcal '+T('เฉลี่ย','avg'))}${cell(avg('p')?avg('p')+' g':'-',T('โปรตีนเฉลี่ย','Protein avg'))}${cell(wv,T('น้ำหนักเฉลี่ย kg','Avg weight kg'))}</div>`;
}
function home(){
 const nav=[['plan','cal',T('ปฏิทิน','Planner')],['goal','goal',T('เป้าหมาย','Goals')],['gym','gym',T('ฟิตเนส','Fitness')],['food','health',T('สุขภาพ','Health')],['set','set',T('ตั้งค่า','Settings')]];
 const st=[['gym',streakHTML(30,38),T('streak วัน','Day streak'),"G='streak';"],['plan','<b>'+dueCount()+'</b>',T('งานค้าง/วันนี้','Tasks due')],['food','<b>'+foodTotal(today())+'</b>','kcal']];

 <h2>${T('เป้าหมาย','Goals')}</h2>${gs.map(g=>`<div class="card"><div class="row"><b style="flex:1">${esc(g.n)}</b><span class="mut">${gmeta(g)}</span></div>${gctl(g)}</div>`).join('')||`<p class="mut">${T('ยังไม่มีเป้าหมาย','No goals yet')}</p>`}`;

/* Planner */
function planner(){
 const up=S.tasks.filter(t=>!t.done&&t.d>selD).sort((a,b)=>a.d<b.d?-1:1).slice(0,5);
 return head(T('ปฏิทินงาน','Planner'),0,'cal')+`<div class="card">${cal()}</div>`+dayDetail(selD,true)+(up.length?`<h2>${T('งานถัดไป','Upcoming')}</h2>`+up.map(t=>`<div class="card row"><span style="flex:1">${esc(t.t)}</span><span class="mut">${t.d.slice(5)}</span></div>`).join(''):'');
}
function addTask(){const t=val('qt').trim();if(!t)return;const r=val('qr');S.tasks.push({id:uid(),t,n:val('qn').trim(),d:selD,done:false,...(r?{r}:{})});dT='';dN='';dR='';save();render()}
const tg=(id,k)=>{const t=S.tasks.find(x=>x.id==id);if(t.r){t.dn=t.dn||{};t.dn[k]=!t.dn[k]}else t.done=!t.done;save();render()};
const rmTask=id=>{const t=S.tasks.find(x=>x.id==id);if(t&&t.r&&!confirm(T('ลบงานซ้ำนี้ทั้งชุด','Delete this whole repeating series')))return;S.tasks=S.tasks.filter(x=>x.id!=id);save();render()};
/* Goals */
const gv=(id,d)=>(S.glog[id]||{})[d]||0;
const latest=id=>{const o=S.glog[id]||{},k=Object.keys(o).filter(d=>d<=today()).sort();return k.length?o[k[k.length-1]]:0};
const dleft=g=>Math.round((new Date(g.due+'T00:00')-new Date(today()+'T00:00'))/864e5);
function gmeta(g){if(g.mode!='due')return T('รายวัน','Daily');const n=dleft(g);return n>=0?T('เหลือ '+n+' วัน',n+' days left'):T('เลยกำหนด '+(-n)+' วัน',(-n)+' days overdue')}
function gctl(g){
 const due=g.mode=='due',v=due?latest(g.id):gv(g.id,today());
 return g.type=='check'?`<div class="row"><input type="checkbox" ${v>=100?'checked':''} onchange="setG('${g.id}',this.checked?100:0)"><span>${due?T('สำเร็จแล้ว','Completed'):T('ทำวันนี้แล้ว','Done today')}</span></div>`
 :`<div class="row"><input type="range" min="0" max="100" step="5" value="${v}" onchange="setG('${g.id}',+this.value)" oninput="this.nextElementSibling.textContent=this.value+'%'"><span style="width:44px;text-align:right">${v}%</span></div>`;

function goals(){
 const wk=n=>[6,5,4,3,2,1,0].map(i=>gv(n,back(i)));
 return head(T('เป้าหมาย','Goals'),0,'goal')+`<div class="card"><input id="gn" placeholder="${T('ชื่อเป้าหมาย','Goal name')}" style="margin-bottom:8px">
 <div class="row"><select id="gt"><option value="check">${T('แบบติ๊ก','Check-off')}</option><option value="bar">${T('แบบแถบ %','Slider %')}</option></select><select id="gm" onchange="$('gd').style.display=this.value=='due'?'':'none'"><option value="daily">${T('รายวัน','Daily')}</option><option value="due">${T('มีกำหนดส่ง','Deadline')}</option></select></div>
 <div class="row"><input id="gd" type="date" value="${back(-7)}" style="display:none"><button class="btn" style="width:100%" onclick="addGoal()">+ ${T('เพิ่มเป้าหมาย','Add goal')}</button></div></div>`+
 (S.goals.map(g=>{const due=g.mode=='due',v=latest(g.id);let ex;
  if(due)ex=`<div class="mut" style="margin-top:6px">${T('กำหนด','Due')} ${g.due} · ${v}%</div><div class="bar" style="margin-top:4px"><i style="width:${v}%"></i></div>`;
  else{const days=wk(g.id),avg=Math.round(days.reduce((a,b)=>a+b,0)/7);ex=`<div class="dots">${days.map(x=>`<i class="${x>=100?'on':''}" style="${x>0&&x<100?'background:var(--ac);opacity:'+(x/100)+';':''}"></i>`).join('')}</div><div class="mut" style="margin-top:6px">${T('เฉลี่ย 7 วัน','7-day avg')} ${avg}%</div><div class="bar" style="margin-top:4px"><i style="width:${avg}%"></i></div>`}
  return `<div class="card"><div class="row"><b style="flex:1">${esc(g.n)}</b><span class="mut">${gmeta(g)}</span><button class="x" onclick="rmGoal('${g.id}')">×</button></div>${gctl(g)}${ex}</div>`}).join('')||`<p class="mut">${T('เพิ่มเป้าหมายแรกของคุณ','Add your first goal.')}</p>`);

function addGoal(){const n=val('gn').trim();if(!n)return;const m=val('gm'),dd=val('gd');if(m=='due'&&!dd)return alert(T('เลือกวันกำหนด','Pick a due date'));S.goals.push({id:uid(),n,type:val('gt'),mode:m,due:dd});save();render()}

const setG=(id,v)=>{(S.glog[id]=S.glog[id]||{})[today()]=v;save();render()};

 a.slice(-10).reverse().map(e=>`<div class="card row"><span style="flex:1">${e.d}<br><span class="mut">${e.bed} → ${e.wake}</span></span><b>${fdur(sdur(e))}</b><button class="x" onclick="rmSleep('${e.d}')">×</button></div>`).join('');
}
const sleepNow=()=>{S.sp={bed:nowHM()};save();render()};
const wakeNow=()=>{if(!S.sp)return;S.sl=S.sl.filter(x=>x.d!=today());S.sl.push({d:today(),bed:S.sp.bed,wake:nowHM()});S.sp=null;save();render()};

 const half=l=>l.map(([m,d])=>`<path class="mz ${pm==m?'on':''}" style="--c:${MC[m]}" d="${d}" onclick="pickM('${m}')"/>`).join('');
 const base=sh=>`<path class="nz" d="M100 3Q114 3 115 19Q115 30 110 37Q106 43 100 43Q94 43 90 37Q85 30 85 19Q86 3 100 3Z"/><path class="nz" d="M68 52Q100 44 132 52Q144 66 140 96Q134 118 128 140Q126 152 118 160L100 164L82 160Q74 152 72 140Q66 118 60 96Q56 66 68 52Z"/>`+[0,1].map(f=>`<g ${f?'transform="translate(200,0) scale(-1,1)"':''}><path class="nz" d="M98 148Q84 146 76 156Q70 190 74 230Q76 262 77 306Q82 318 92 316Q97 280 97 240Q101 200 98 148Z"/><path class="nz" d="M39 158Q34 170 35 182Q36 190 42 191Q50 190 52 182Q54 170 52 158Z"/><path class="nz" d="M77 312Q73 328 71 338Q72 346 80 347Q90 347 93 340Q95 330 92 314Z"/></g>`).join('');
 const fig=(l,sh)=>base(sh)+`<g>${half(l)}</g><g transform="translate(200,0) scale(-1,1)">${half(l)}</g>`;
 return `<svg viewBox="0 0 400 362" style="width:100%;max-width:380px;display:block;margin:0 auto"><g>${fig(FR,1)}<path class="ln" d="M79 112H121M78 126H122M100 94V150"/></g><g transform="translate(200,0)">${fig(BK,0)}</g>
 <text x="100" y="358" font-size="11" text-anchor="middle" fill="var(--mut)">${T('ด้านหน้า','Front')}</text><text x="300" y="358" font-size="11" text-anchor="middle" fill="var(--mut)">${T('ด้านหลัง','Back')}</text></svg>
 <div class="mg">${MUS.map(m=>`<button class="${pm==m?'on':''}" onclick="pickM('${m}')">${mn(m)}<small>${S.ex.filter(e=>mus(e).includes(m)).length} ${T('ท่า','ex.')}</small></button>`).join('')}</div>`;
}
function gProg(){
 const exs=S.ex.filter(e=>mus(e).includes(pm));
 let h=bodyMap();
 if(!pm)return h+`<p class="mut">${T('แตะกล้ามเนื้อเพื่อดูท่าและกราฟ','Tap a muscle to see its exercises.')}</p>`;
 h+=`<div class="chips">${exs.map(e=>`<button class="chip ${pe==e.id?'on':''}" onclick="pe='${e.id}';render()">${esc(e.n)}</button>`).join('')||`<span class="mut">${T('ยังไม่มีท่า','No exercises')}</span>`}</div>`;
 if(!pe)return h;
 const p=series(pe),e=exn(pe),u=e.c=='time'?'min/day':'kg (max)';
 if(p.length<2)return h+prCard(pe)+sugCard(pe)+`<p class="mut">${T('ต้องมีข้อมูลอย่างน้อย 2 วันจึงจะเห็นกราฟ','Log at least 2 days to see a chart.')} (${p.length})</p>`;
 const q=agg(inRange(p),'max');
 return h+prCard(pe)+sugCard(pe)+`<div class="card"><div class="mut" style="margin-bottom:6px">${esc(e.n)} — ${u}</div>${rangeBar()}${chartSVG(q.p,{})}${aggNote(q.w,'max')}</div>`;
}
const trained=d=>S.wk[d]&&Object.values(S.wk[d]).some(a=>a.length);
function streakN(){let n=0,i=trained(today())||S.skip[today()]?0:1;for(;i<400;i++){const d=back(i);if(trained(d))n++;else if(!S.skip[d])break}return n}
const FLAME='M44 2C58 10 68 28 69 44C70 52 70 58 72 62C74 52 80 44 85 39C94 50 100 64 100 80C100 108 80 130 50 130C20 130 0 108 0 84C-2 66 10 48 22 36C32 26 40 14 44 2Z';
const HEART=h=>`<svg viewBox="0 0 100 90" height="${h}" width="${Math.round(h*100/90)}"><defs><mask id="bkm"><rect width="100" height="90" fill="#fff"/><path d="M52 4L44 28L58 44L46 62L54 92" stroke="#000" stroke-width="7" fill="none" stroke-linejoin="round" stroke-linecap="round"/></mask></defs><path mask="url(#bkm)" fill="currentColor" d="M50 85C20 62 2 44 2 26C2 12 13 3 26 3C36 3 45 8 50 16C55 8 64 3 74 3C87 3 98 12 98 26C98 44 80 62 50 85Z"/></svg>`;
const streakHTML=fs=>{const h=Math.round(fs*.8),n=streakN(),f=n>99?fs*.7:fs;return `<div class="sk"><b style="font-size:${f}px">${n}</b>${n?`<svg viewBox="0 0 100 130" height="${h}" width="${Math.round(h*100/130)}"><path d="${FLAME}" fill="currentColor"/></svg>`:HEART(Math.round(h*.9))}</div>`};
function trainSummary(){
 const days=[...Array(7).keys()].map(i=>back(i+7*wkOff));let sets=0,cnt={};
 days.forEach(d=>Object.keys(S.wk[d]||{}).forEach(id=>{const n=S.wk[d][id].length;sets+=n;mus(exn(id)).forEach(m=>cnt[m]=(cnt[m]||0)+n)}));
 const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]);
 return `<div class="seg s2"><button class="${wkOff?'':'on'}" onclick="wkOff=0;render()">${T('7 วันล่าสุด','Last 7 days')}</button><button class="${wkOff?'on':''}" onclick="wkOff=1;render()">${T('7 วันก่อนหน้า','Previous 7')}</button></div><div class="card"><div class="row"><b style="font-size:26px;flex:1">${sets}</b><span class="mut">${T('เซ็ตรวม','total sets')}</span></div>${top.length?`<div class="chips">${top.map(([m,n])=>`<span class="chip">${mn(m)} ${n}</span>`).join('')}</div>`:''}</div>`;
}
let hd='';
let edK='';
function dayHist(d){
 const w=S.wk[d]||{},ids=Object.keys(w).filter(k=>w[k].length),wu=S.wu[d]||{};
 return `<h2>${d==today()?T('วันนี้','Today'):d}</h2>${S.skip[d]?`<div class="mut">${T('พัก','Rest')}: ${esc(S.skip[d])}</div>`:''}`+
 (ids.length?ids.map(id=>{const e=exn(id);return `<div class="card"><b>${esc(e.n)}</b>${(wu[id]||[]).map((s,k)=>`<div class="row mut"><span style="flex:1">${T('วอร์มอัป','Warm-up')} ${k+1}: ${fmt(e,s)}</span><button class="x" onclick="hRmW('${d}','${id}',${k})">×</button></div>`).join('')}${w[id].map((s,k)=>`<div class="row"><span class="mut" style="width:48px;flex:none">${T('เซ็ต','Set')} ${k+1}</span><input type="number" inputmode="decimal" value="${s.a}" placeholder="${e.c=='time'?'min':'reps'}" onchange="hSet('${d}','${id}',${k},'a',this.value)">${e.c=='time'?'':`<input type="number" inputmode="decimal" value="${s.b||''}" placeholder="kg" onchange="hSet('${d}','${id}',${k},'b',this.value)">`}<button class="x" onclick="hRm('${d}','${id}',${k})">×</button></div>`).join('')}</div>`}).join(''):`<p class="mut">${T('ไม่มีบันทึกออกกำลังกายวันนี้','No workout logged')}</p>`)+
 `<div class="card"><div class="mut" style="margin-bottom:6px">${T('เพิ่มเซ็ตย้อนหลัง','Add a set to this day')}</div><select id="hx"><option value="">${T('เลือกท่า','Pick exercise')}</option>${exOpts(S.ex)}</select><div class="row" style="margin-top:8px"><input id="ha" type="number" inputmode="decimal" placeholder="reps / min"><input id="hb" type="number" inputmode="decimal" placeholder="kg"><button class="btn" onclick="hAdd('${d}')">+</button></div></div>`;
}
const hSet=(d,id,k,f,v)=>{S.wk[d][id][k][f]=+v;save()};
function hRm(d,id,k){S.wk[d][id].splice(k,1);if(!S.wk[d][id].length)delete S.wk[d][id];if(!Object.keys(S.wk[d]).length)delete S.wk[d];save();render()}
const hRmW=(d,id,k)=>{S.wu[d][id].splice(k,1);save();render()};
function hAdd(d){const id=val('hx'),a=+val('ha'),b=+val('hb')||0;if(!id||!a)return;((S.wk[d]=S.wk[d]||{})[id]=S.wk[d][id]||[]).push({a,b});save();render()}
function gStreak(){
 const d=today(),sk=S.skip[d];
 return `<div class="card" style="text-align:center">${streakHTML(76,96)}<div class="mut" style="margin-top:6px">${T('วันต่อเนื่อง','day streak')}</div></div>${trainSummary()}
 <div class="card">${sk?`<div class="row"><span style="flex:1">${T('วันนี้พัก','Rest today')}: ${esc(sk)}</span><button class="x" onclick="delete S.skip['${d}'];save();render()">×</button></div>`:`<div class="row"><input id="sr" placeholder="${T('วันนี้ไม่ว่าง เพราะ…','Skipping today because…')}"><button class="btn" onclick="skipDay()">OK</button></div>`}</div>
 <div class="hgrid">${[...Array(28).keys()].reverse().map(n=>{const x=back(n);return `<button class="hb ${trained(x)?'on':S.skip[x]?'sk':''} ${(hd||today())==x?'sel':''}" onclick="hd='${x}';render()">${+x.slice(8)}</button>`}).join('')}</div>${dayHist(hd||today())}
 ${Object.keys(S.skip).sort().reverse().slice(0,5).map(x=>`<div class="mut">${x}: ${esc(S.skip[x])}</div>`).join('')}`;
}
function skipDay(){const r=val('sr').trim();if(!r)return;S.skip[today()]=r;save();render()}
/* Rest timer */
let AC=null;
function unlockAudio(){try{const C=typeof AudioContext!='undefined'?AudioContext:typeof webkitAudioContext!='undefined'?webkitAudioContext:null;if(!C)return;AC=AC||new C();if(AC.state=='suspended')AC.resume()}catch(e){}}
function beep(){if(!S.snd||!AC)return;try{[0,.25,.5].forEach(t=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=880;g.gain.value=.25;o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+t);o.stop(AC.currentTime+t+.15)})}catch(e){}}
const togSnd=()=>{S.snd=!S.snd;save();unlockAudio();if(S.snd)beep();render()};
function rest(s){clearInterval(rt);if(!s){$('rest').style.display='none';return}
 unlockAudio();const end=Date.now()+s*1000;$('rest').style.display='block';
 const tick=()=>{const l=Math.ceil((end-Date.now())/1000);if(l<=0){clearInterval(rt);$('rt').textContent=T('พักครบแล้ว!','Rest over!');try{navigator.vibrate&&navigator.vibrate(300)}catch(e){}beep();setTimeout(()=>{$('rest').style.display='none'},3000);return}
  $('rt').textContent=Math.floor(l/60)+':'+String(l%60).padStart(2,'0')};
 tick();rt=setInterval(tick,250)}
/* Settings */
function settings(){
 const P=[['#000000','#ffffff'],['#ffffff','#000000'],['#0b1b3a','#8ab4ff'],['#0c0c0e','#c9c9d1'],['#f4f6fb','#2457d6'],['#10261f','#7fd1a8'],['#2a1633','#e6a8ff'],['#2b1b12','#ffb27a']];
 const ci=(k,v)=>`<input type="color" value="${v}" style="width:64px;height:40px;padding:2px;flex:none" oninput="S.${k}=this.value;applyTheme()" onchange="save()">`;
 return head(T('ตั้งค่า','Settings'),0,'set')+`<div class="card"><b>${T('โทนสี','Colors')}</b>
 <div class="row"><span style="flex:1">${T('สีพื้นหลัง','Background')}</span>${ci('cbg',S.cbg||'#000000')}</div>
 <div class="row"><span style="flex:1">${T('สีเน้น','Accent')}</span>${ci('cac',S.cac||'#ffffff')}</div>
 <div class="chips">${P.map(p=>`<button class="chip" style="background:${p[0]};border:3px solid ${p[1]};width:38px;height:38px;padding:0" onclick="S.cbg='${p[0]}';S.cac='${p[1]}';save();render()"></button>`).join('')}</div></div>
 <div class="card row"><span style="flex:1"><b>${T('เสียงเตือนตอนพักจบ','Rest-end alarm')}</b></span><button class="chip ${S.snd?'on':''}" onclick="togSnd()">${S.snd?T('เปิด','On'):T('ปิด','Off')}</button></div>
 <div class="card"><b>${T('ภาษา','Language')}</b><div class="chips"><button class="chip ${S.lang=='th'?'on':''}" onclick="S.lang='th';save();render()">ไทย</button><button class="chip ${S.lang=='en'?'on':''}" onclick="S.lang='en';save();render()">English</button></div></div>
 <div class="card"><b>${T('เป้าโภชนาการต่อวัน','Daily nutrition goals')}</b><div class="row" style="margin-top:8px"><input id="kg" type="number" value="${S.kgoal}" placeholder="kcal"><input id="pg" type="number" value="${S.pg||''}" placeholder="P g"><input id="cg" type="number" value="${S.cg||''}" placeholder="C g"><input id="fg" type="number" value="${S.fg||''}" placeholder="F g"></div><button class="btn" onclick="S.kgoal=+val('kg')||2000;S.pg=+val('pg')||0;S.cg=+val('cg')||0;S.fg=+val('fg')||0;save();render()">OK</button></div>
 <div class="card"><b>${T('สำรองข้อมูล','Backup')}</b><p class="mut">${T('คัดลอกข้อมูลไปอีกเครื่องด้วยมือ','Copy your data to another device manually')}</p>
 <textarea id="bk" placeholder="${T('สำรอง/ย้ายข้อมูลด้วยมือ','Manual backup / transfer')}"></textarea><div class="row"><button class="ghost" onclick="$('bk').value=JSON.stringify(S)">${T('ส่งออก','Export')}</button><button class="ghost" onclick="impD()">${T('นำเข้า','Import')}</button></div>
 <div class="row"><button class="ghost" onclick="exportFile()">${T('ส่งออกเป็นไฟล์','Export as file')}</button><label class="ghost" style="cursor:pointer;text-align:center">${T('นำเข้าจากไฟล์','Import file')}<input type="file" accept=".json,application/json" style="display:none" onchange="importFile(this)"></label></div></div>
 ${storageCard()}
 <div class="card"><b>${T('ชื่อ','Name')}</b><div class="row" style="margin-top:8px"><input id="un" value="${esc(S.user.n)}"><button class="btn" onclick="S.user.n=val('un').trim()||S.user.n;save();render()">OK</button></div></div>
 <div class="card row"><span style="flex:1">${esc(EM)}<br><span class="mut">${SYNC=='ok'?T('ซิงค์แล้ว','Synced'):SYNC=='err'?T('ซิงค์ไม่สำเร็จ','Sync error'):''}</span></span><button class="ghost" onclick="syncNow()">${T('ซิงค์','Sync')}</button><button class="ghost" onclick="logout()">${T('ออกจากระบบ','Log out')}</button></div>`;
}
function impD(){try{const o=JSON.parse(val('bk'));S=Object.assign(S,o);S.logged=true;save();render()}catch(e){alert(T('ข้อมูลไม่ถูกต้อง','Invalid data'))}}
setTimeout(()=>{const b=banner();QUOTA=probeQuota();if(banner()!==b)render()},3000);
render();boot();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
